<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>BMI Calculator</title>
</head>
<body>
    <h1>BMI Calculator</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Gewicht in kg:</label>
        <input type="number" step="0.1" name="weight" required>

        <br><br>

        <label>Lengte in meter:</label>
        <input type="number" step="0.01" name="height" required>

        <br><br>

        <button type="submit">Bereken BMI</button>
    </form>

    {% if bmi %}
        <h2>Resultaat</h2>
        <p>BMI: {{ bmi }}</p>
        <p>Categorie: {{ category }}</p>
    {% endif %}
</body>
</html>
